name: Voice integration source export

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Archive source
        run: tar --exclude=.git -czf /tmp/metafor-source.tar.gz .
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: metafor-source
          path: /tmp/metafor-source.tar.gz
          retention-days: 1
      - name: Publish run id
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p .github/voice-integration
          printf '%s\n' "$RUN_ID" > .github/voice-integration/export-run-id.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/voice-integration/export-run-id.txt
          git commit -m "chore: record voice integration export run [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
