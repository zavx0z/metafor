name: One-shot Actor to Atom migration

on:
  issues:
    types: [edited, labeled, reopened]

permissions:
  contents: write

jobs:
  rename:
    if: github.event.issue.number == 93
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      FORCE_ADDRESS: ws://127.0.0.1:1
      FORCE_RECONNECT: "0"
      WGPU_BACKEND: vulkan
      METAFOR_REQUIRE_GPU: "1"

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Vulkan software adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Rename Actor to Atom
        run: python3 scripts/atom-rename.py

      - name: Regenerate and freeze lockfile
        run: |
          set -euo pipefail
          bun install
          bun install --frozen-lockfile

      - name: Prove Actor is absent
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E 'Actor|ACTOR'; then
            echo "Actor terminology remains" >&2
            exit 1
          fi
          if git grep -n -I -P '(?<![A-Za-z])actors?(?![a-z])'; then
            echo "actor terminology remains" >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|[/_.-])(actor|Actor|ACTOR)(s)?([/_.-]|$)'; then
            echo "Actor path remains" >&2
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Test complete repository
        run: bun run test

      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MetaFor migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: rename Actor to Atom everywhere"
          git push origin HEAD:main
