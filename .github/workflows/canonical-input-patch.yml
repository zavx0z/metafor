name: Apply canonical Input patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-input
          fetch-depth: 0

      - name: Patch Matrix and runtime universe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_slice(path: str, start_marker: str, end_marker: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"{path}: missing start marker: {start_marker}")
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"{path}: missing end marker: {end_marker}")
              end += len(end_marker)
              file.write_text(text[:start] + replacement + text[end:])

          matrix = Path("matrix/matrix.ts")
          matrix_text = matrix.read_text()
          import_line = 'import {isProcessExecutionId} from "@metafor/types/force/execution"\n'
          if matrix_text.count(import_line) != 1:
              raise SystemExit("matrix/matrix.ts: Process ID import not found exactly once")
          matrix.write_text(matrix_text.replace(import_line, ""))
          replace_slice(
              "matrix/matrix.ts",
              "  const committedExecutionId = parts.length === 1 && isProcessExecutionId(parts[0]?.from)",
              "  })",
              '''  const origin = parts.length === 1 ? parts[0] : undefined
          const actorId = origin ? parseActorIdPath(origin.path) : null
          const pending = actorId === null ? undefined : pendingProcessExecutionsByActorId.get(actorId)

          const updates = collectActorFieldUpdates(parts, kind)
          if (updates.length === 0) return []
          return await update(updates, {
            // Any canonical consequence may update a locked Actor, but an active
            // Process must not be claimed again before its Boundary acknowledgment.
            retriggerProcessStates: pending === undefined,
          })''',
          )

          replace_slice(
              "fixture/runtime-universe.spec.ts",
              "      const inputStart = force.lines.length",
              "        input.lineIndex + 1)",
              '''      const inputId = `input:${crypto.randomUUID()}`
          const inputStart = force.lines.length
          await postImpulse(forceHttp, {
            part: "gluon",
            op: "test",
            path: sourceActorId,
            from: inputId,
            value: {fields: {[String(inputFieldId)]: 1}},
          })
          const inputProposal = await waitForForceEvent(force, (event) =>
            event.source === "force:http" && particle(event).part === "gluon" &&
            particle(event).op === "test" && particle(event).path === sourceActorId && particle(event).from === inputId,
            inputStart)
          const input = await waitForForceEvent(force, (event) =>
            event.source === "force:boundary" && particle(event).part === "gluon" &&
            particle(event).op === "replace" && particle(event).path === sourceActorId && particle(event).from === inputId,
            inputProposal.lineIndex + 1)
          expect(particle(input).value).toEqual({fields: {[String(inputFieldId)]: 1}})
          const ready = await waitForForceEvent(force, (event) =>
            event.source === "force:matrix" && particle(event).part === "photon" &&
            particle(event).op === "test" && particle(event).path === sourceActorId && particle(event).value === "ready",
            input.lineIndex + 1)''',
          )

          fixture_path = Path("fixture/runtime-universe.spec.ts")
          fixture_text = fixture_path.read_text()
          values_start = fixture_text.find("        const values = await inspection")
          states_start = fixture_text.find("        const states = await inspection", values_start)
          if values_start < 0 or states_start < 0:
              raise SystemExit("fixture/runtime-universe.spec.ts: values/state block not found")
          values_block = '''        const values = await inspection<Array<{actor: number; field: number; valueJson: string}>>`
            SELECT actor, field, value_json AS valueJson
              FROM boundary_actor_field
             WHERE (actor = ${sourceActorId} AND field IN (${inputFieldId}, ${outputFieldId}))
                OR (actor = ${targetActorId} AND field = ${targetFieldId})
          `
          const materialized = new Map(values.map((row) => [
            `${Number(row.actor)}:${Number(row.field)}`,
            JSON.parse(row.valueJson) as unknown,
          ]))
          expect(materialized.get(`${sourceActorId}:${inputFieldId}`)).toBe(1)
          expect(materialized.get(`${sourceActorId}:${outputFieldId}`)).toBe(2)
          expect(materialized.get(`${targetActorId}:${targetFieldId}`)).toBe(2)
          '''
          fixture_path.write_text(fixture_text[:values_start] + values_block + fixture_text[states_start:])

          fixture_text = fixture_path.read_text()
          ordered_old = "      const ordered = [\n        bootstrap,\n        input,\n        ready,"
          ordered_new = "      const ordered = [\n        bootstrap,\n        inputProposal,\n        input,\n        ready,"
          if fixture_text.count(ordered_old) != 1:
              raise SystemExit("fixture/runtime-universe.spec.ts: ordered block not found exactly once")
          fixture_path.write_text(fixture_text.replace(ordered_old, ordered_new))

          Path(".github/workflows/canonical-input-patch.yml").unlink()
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Замкнуть canonical Input через Boundary"
          git push origin HEAD:agent/canonical-input
