name: Apply Voice Engine V2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-voice-engine-v2.yml"

permissions:
  contents: write

concurrency:
  group: apply-voice-engine-v2
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish run id
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          printf '%s\n' "$RUN_ID" > .github/voice-integration/apply-run-id.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/voice-integration/apply-run-id.txt
          git commit -m "chore: record Voice Engine V2 integration run [skip ci]"
          git push origin HEAD:main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Decode and apply verified patch
        shell: bash
        run: |
          cat .github/voice-integration/v2-00.b64 \
              .github/voice-integration/v2-01.b64 \
              .github/voice-integration/v2-02.b64 \
              .github/voice-integration/v2-03.b64 \
              .github/voice-integration/v2-04a.b64 \
              .github/voice-integration/v2-04b.b64 \
            | tr -d '\n\r ' \
            | base64 -d > /tmp/voice-engine-v2.patch.gz
          gzip -dc /tmp/voice-engine-v2.patch.gz > /tmp/voice-engine-v2.patch
          echo "f62ec1ccaa76257621ecaf7b6044662ac141db0a7658800e062063846d507c30  /tmp/voice-engine-v2.patch" | sha256sum -c -
          git apply --check /tmp/voice-engine-v2.patch
          git apply /tmp/voice-engine-v2.patch
          rm -rf .github/voice-integration
          rm -f .github/workflows/apply-voice-engine-v2.yml
          git diff --check
      - name: Install dependencies
        shell: bash
        run: |
          set +e
          bun install --ignore-scripts > /tmp/bun-install.log 2>&1
          status=$?
          cat /tmp/bun-install.log
          if [ "$status" -ne 0 ]; then
            mkdir -p .github/voice-integration
            tail -n 160 /tmp/bun-install.log > .github/voice-integration/install-error.txt
            git add .github/voice-integration/install-error.txt
            git commit -m "chore: record Voice Engine V2 install failure [skip ci]"
            git push origin HEAD:main
            exit "$status"
          fi
          git checkout -- bun.lock
      - name: Voice tests
        run: |
          bun test pkg/interpreter/web/voice-input.test.ts
          bun test pkg/interpreter/web/voice-chunk-journal.test.ts
          bun test pkg/interpreter/web/voice-rtc.test.ts
          bun test pkg/interpreter/web/voice-text.test.ts
          bun test ui/components/voice-runtime-state.test.ts
          bun test ui/components/ButtonVoice.test.ts
      - name: Interpreter web tests
        run: bun test pkg/interpreter/web
      - name: Typecheck interpreter
        run: bun --filter @metafor/interpreter typecheck
      - name: Typecheck UI components
        run: bunx tsc --noEmit --pretty false -p ui/components/tsconfig.json
      - name: Browser bundles
        run: |
          bun build pkg/interpreter/web/main.ts --target=browser --outdir /tmp/metafor-interpreter-web
          bun build ui/components/index.ts --target=browser --outdir /tmp/metafor-ui-components
      - name: Commit verified integration
        shell: bash
        run: |
          git add -A
          git diff --cached --check
          git commit -m "Implement Voice Engine V2 continuous dictation"
          git push origin HEAD:main
