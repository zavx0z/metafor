name: Apply Voice Engine V2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-voice-engine-v2.yml"

permissions:
  contents: write

concurrency:
  group: apply-voice-engine-v2
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish run id
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          printf '%s\n' "$RUN_ID" > .github/voice-integration/apply-run-id.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/voice-integration/apply-run-id.txt
          git commit -m "chore: record Voice Engine V2 integration run [skip ci]"
          git push origin HEAD:main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Decode and apply verified patch
        shell: bash
        run: |
          cat .github/voice-integration/v2-00.b64 \
              .github/voice-integration/v2-01.b64 \
              .github/voice-integration/v2-02.b64 \
              .github/voice-integration/v2-03.b64 \
              .github/voice-integration/v2-04a.b64 \
              .github/voice-integration/v2-04b.b64 \
            | tr -d '\n\r ' \
            | base64 -d > /tmp/voice-engine-v2.patch.gz
          gzip -dc /tmp/voice-engine-v2.patch.gz > /tmp/voice-engine-v2.patch
          echo "f62ec1ccaa76257621ecaf7b6044662ac141db0a7658800e062063846d507c30  /tmp/voice-engine-v2.patch" | sha256sum -c -
          git apply --check /tmp/voice-engine-v2.patch
          git apply /tmp/voice-engine-v2.patch
          python3 - <<'PY'
          from pathlib import Path

          journal = Path("pkg/interpreter/web/voice-chunk-journal.ts")
          text = journal.read_text()
          old = '      const digest = await crypto.subtle.digest("SHA-256", bytes)'
          new = '      const digestInput = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength) as ArrayBuffer\n      const digest = await crypto.subtle.digest("SHA-256", digestInput)'
          if old not in text:
              raise SystemExit("voice journal digest marker missing")
          journal.write_text(text.replace(old, new, 1))

          transport = Path("pkg/interpreter/web/voice-transport.ts")
          text = transport.read_text()
          old = '  sendProtocol?(message: VoiceProtocolMessage): void\n}'
          new = '  sendProtocol?(message: VoiceProtocolMessage): void\n  replaceAudioStream?(stream: MediaStream): void | Promise<void>\n}'
          if old not in text:
              raise SystemExit("voice transport marker missing")
          transport.write_text(text.replace(old, new, 1))
          PY
          rm -rf .github/voice-integration
          rm -f .github/workflows/apply-voice-engine-v2.yml
          git diff --check
      - name: Install dependencies
        run: |
          bun install --ignore-scripts
          git checkout -- bun.lock
      - name: Verify Voice Engine V2
        shell: bash
        run: |
          set +e
          bash -c '
            set -euo pipefail
            bun test pkg/interpreter/web/voice-input.test.ts
            bun test pkg/interpreter/web/voice-chunk-journal.test.ts
            bun test pkg/interpreter/web/voice-rtc.test.ts
            bun test pkg/interpreter/web/voice-text.test.ts
            bun test ui/components/voice-runtime-state.test.ts
            bun test ui/components/ButtonVoice.test.ts
            bun test pkg/interpreter/web
            bun --filter @metafor/interpreter typecheck
            bunx tsc --noEmit --pretty false -p ui/components/tsconfig.json
            bun build pkg/interpreter/web/main.ts --target=browser --outdir /tmp/metafor-interpreter-web
            bun build ui/components/index.ts --target=browser --outdir /tmp/metafor-ui-components
            git diff --check
          ' > /tmp/voice-engine-v2-verify.log 2>&1
          status=$?
          cat /tmp/voice-engine-v2-verify.log
          if [ "$status" -ne 0 ]; then
            mkdir -p .github/voice-integration
            tail -n 300 /tmp/voice-engine-v2-verify.log > .github/voice-integration/verify-error.txt
            git add .github/voice-integration/verify-error.txt
            git commit -m "chore: record Voice Engine V2 verification failure [skip ci]"
            git push origin HEAD:main
            exit "$status"
          fi
      - name: Commit verified integration
        shell: bash
        run: |
          git add -A
          git diff --cached --check
          git commit -m "Implement Voice Engine V2 continuous dictation"
          git push origin HEAD:main
