name: Normalize canonical Input diff

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-input
          fetch-depth: 0

      - name: Normalize touched blocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_slice(path: str, start_marker: str, end_marker: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              start = text.find(start_marker)
              end = text.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit(f"{path}: formatting markers not found")
              end += len(end_marker)
              file.write_text(text[:start] + replacement + text[end:])

          replace_slice(
              "matrix/matrix.ts",
              "  const origin = parts.length === 1 ? parts[0] : undefined",
              "})",
              '''  const origin = parts.length === 1 ? parts[0] : undefined
          const actorId = origin ? parseActorIdPath(origin.path) : null
          const pending = actorId === null ? undefined : pendingProcessExecutionsByActorId.get(actorId)

          const updates = collectActorFieldUpdates(parts, kind)
          if (updates.length === 0) return []
          return await update(updates, {
            // Any canonical consequence may update a locked Actor, but an active
            // Process must not be claimed again before its Boundary acknowledgment.
            retriggerProcessStates: pending === undefined,
          })''',
          )

          replace_slice(
              "fixture/runtime-universe.spec.ts",
              "      const inputId = `input:${crypto.randomUUID()}`",
              "  input.lineIndex + 1)",
              '''      const inputId = `input:${crypto.randomUUID()}`
          const inputStart = force.lines.length
          await postImpulse(forceHttp, {
            part: "gluon",
            op: "test",
            path: sourceActorId,
            from: inputId,
            value: {fields: {[String(inputFieldId)]: 1}},
          })
          const inputProposal = await waitForForceEvent(force, (event) =>
            event.source === "force:http" && particle(event).part === "gluon" &&
            particle(event).op === "test" && particle(event).path === sourceActorId && particle(event).from === inputId,
            inputStart)
          const input = await waitForForceEvent(force, (event) =>
            event.source === "force:boundary" && particle(event).part === "gluon" &&
            particle(event).op === "replace" && particle(event).path === sourceActorId && particle(event).from === inputId,
            inputProposal.lineIndex + 1)
          expect(particle(input).value).toEqual({fields: {[String(inputFieldId)]: 1}})
          const ready = await waitForForceEvent(force, (event) =>
            event.source === "force:matrix" && particle(event).part === "photon" &&
            particle(event).op === "test" && particle(event).path === sourceActorId && particle(event).value === "ready",
            input.lineIndex + 1)''',
          )

          fixture = Path("fixture/runtime-universe.spec.ts")
          text = fixture.read_text()
          start = text.find("        const values = await inspection")
          end = text.find("        const states = await inspection", start)
          if start < 0 or end < 0:
              raise SystemExit("fixture value block markers not found")
          replacement = '''        const values = await inspection<Array<{actor: number; field: number; valueJson: string}>>`
            SELECT actor, field, value_json AS valueJson
              FROM boundary_actor_field
             WHERE (actor = ${sourceActorId} AND field IN (${inputFieldId}, ${outputFieldId}))
                OR (actor = ${targetActorId} AND field = ${targetFieldId})
          `
          const materialized = new Map(values.map((row) => [
            `${Number(row.actor)}:${Number(row.field)}`,
            JSON.parse(row.valueJson) as unknown,
          ]))
          expect(materialized.get(`${sourceActorId}:${inputFieldId}`)).toBe(1)
          expect(materialized.get(`${sourceActorId}:${outputFieldId}`)).toBe(2)
          expect(materialized.get(`${targetActorId}:${targetFieldId}`)).toBe(2)
          '''
          fixture.write_text(text[:start] + replacement + text[end:])

          Path(".github/workflows/canonical-input-format.yml").unlink()
          PY

      - name: Commit normalized diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Нормализовать canonical Input diff"
          git push origin HEAD:agent/canonical-input
