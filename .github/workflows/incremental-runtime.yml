name: incremental-runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - uses: actions/upload-artifact@v4
        with:
          name: generated-bun-lock
          path: bun.lock
      - run: bun run tsc --noEmit
      - run: bun test force dark boundary matrix energy bulk
