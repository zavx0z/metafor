name: incremental-runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - uses: actions/upload-artifact@v4
        with:
          name: generated-bun-lock
          path: bun.lock
      - id: typecheck
        continue-on-error: true
        run: bun run tsc --noEmit 2>&1 | tee tsc.log
      - id: tests
        continue-on-error: true
        run: bun test force dark boundary matrix energy bulk 2>&1 | tee tests.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: |
            tsc.log
            tests.log
      - if: steps.typecheck.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: exit 1
