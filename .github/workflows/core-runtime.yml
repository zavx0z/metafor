name: Core Runtime Verification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/core-runtime.yml"
      - "package.json"
      - "bun.lock"
      - "types/**"
      - "force/**"
      - "dark/**"
      - "boundary/**"
      - "matrix/**"
      - "energy/**"
      - "fixture/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/core-runtime.yml"
      - "package.json"
      - "bun.lock"
      - "types/**"
      - "force/**"
      - "dark/**"
      - "boundary/**"
      - "matrix/**"
      - "energy/**"
      - "fixture/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: core-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-reference:
    name: CPU reference and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
      METAFOR_WEAK_BACKEND: cpu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies and capture lockfile drift
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          bun install --ignore-scripts 2>&1 | tee artifacts/install.log
          cp bun.lock artifacts/bun.lock.generated
          git diff -- bun.lock > artifacts/bun-lock.diff

      - name: Commit refreshed lockfile to the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already synchronized"
            exit 0
          fi
          cp bun.lock /tmp/bun.lock.generated
          git fetch origin "$PR_BRANCH"
          git checkout -B "$PR_BRANCH" "origin/$PR_BRANCH"
          cp /tmp/bun.lock.generated bun.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Обновить bun.lock после удаления stale workspaces"
          git push origin "HEAD:$PR_BRANCH"

      - name: Targeted runtime tests
        shell: bash
        run: |
          set -euo pipefail
          bun test \
            force/core/log.test.ts \
            force/server.test.ts \
            boundary/runtime/matrix.spec.ts \
            matrix/matrix.spec.ts \
            matrix/weak/device.spec.ts \
            matrix/runtime.parity.spec.ts \
            2>&1 | tee artifacts/core-targeted.log

      - name: Complete Weak suite
        shell: bash
        run: |
          set -euo pipefail
          bun test matrix/weak 2>&1 | tee artifacts/matrix-weak.log

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          bun run tsc --noEmit 2>&1 | tee artifacts/tsc.log

      - name: Upload CPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-runtime-cpu-${{ github.sha }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

  webgpu-parity:
    name: WebGPU parity on Vulkan software adapter
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
      METAFOR_WEAK_BACKEND: gpu
      METAFOR_REQUIRE_GPU: "1"
      WGPU_BACKEND: vulkan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan software adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools
          mkdir -p artifacts
          vulkaninfo --summary 2>&1 | tee artifacts/vulkaninfo.log || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install --ignore-scripts 2>&1 | tee artifacts/install.log

      - name: Run strict WebGPU parity
        shell: bash
        run: |
          set -euo pipefail
          bun test matrix/runtime.parity.spec.ts 2>&1 | tee artifacts/webgpu-parity.log

      - name: Upload WebGPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-runtime-webgpu-${{ github.sha }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
