<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetaFor Web</title>
    <style>
      :root {
        --bg: #09111a;
        --panel: rgba(11, 21, 33, 0.78);
        --panel-strong: rgba(17, 29, 44, 0.94);
        --line: rgba(163, 188, 214, 0.18);
        --text: #edf4fb;
        --muted: #90a4b8;
        --accent: #7cd4ff;
        --accent-warm: #ff9b72;
        --ok: #8ce99a;
        --error: #ff7f7f;
        --offline: #7e8b98;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(124, 212, 255, 0.16), transparent 28%),
          radial-gradient(circle at 85% 20%, rgba(255, 155, 114, 0.12), transparent 24%),
          linear-gradient(180deg, #08111a 0%, #050b12 100%);
        color: var(--text);
        font: 14px/1.5 "IBM Plex Sans", "Segoe UI", sans-serif;
      }

      main {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(280px, 360px) 1fr;
      }

      aside {
        border-right: 1px solid var(--line);
        background: var(--panel);
        backdrop-filter: blur(24px);
        padding: 16px 14px 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow-y: auto;
      }

      .eyebrow {
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--accent);
        font: 12px/1.2 "IBM Plex Mono", monospace;
      }

      h1 {
        margin: 6px 0 0;
        font: 700 34px/1 "Space Grotesk", "IBM Plex Sans", sans-serif;
        letter-spacing: -0.03em;
      }

      .lead {
        margin: 0;
        color: var(--muted);
        max-width: 28rem;
      }

      .panel {
        border: 1px solid var(--line);
        background: var(--panel-strong);
        border-radius: 14px;
        padding: 12px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
      }

      .panel h2 {
        margin: 0 0 10px;
        font: 600 11px/1.2 "IBM Plex Mono", monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      form {
        display: grid;
        gap: 12px;
      }

      .settings-cards {
        display: grid;
        gap: 10px;
      }

      .settings-card {
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 10px;
        background: rgba(5, 10, 16, 0.52);
      }

      .settings-card h3 {
        margin: 0 0 8px;
        color: var(--accent);
        font: 600 11px/1.2 "IBM Plex Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .settings-group {
        display: grid;
        gap: 8px;
      }

      .setting-field {
        display: grid;
        gap: 6px;
        position: relative;
      }

      .setting-label-row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: center;
        gap: 8px;
      }

      label,
      .setting-label-text {
        font: 600 11px/1.2 "IBM Plex Mono", monospace;
        color: var(--muted);
      }

      .setting-value {
        min-width: 42px;
        text-align: right;
        color: var(--text);
        font: 600 11px/1.2 "IBM Plex Mono", monospace;
      }

      .setting-help {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        display: inline-grid;
        place-items: center;
        border: 1px solid var(--line);
        padding: 0;
        background: rgba(7, 15, 24, 0.92);
        color: var(--accent);
        font: 700 11px/1 "IBM Plex Mono", monospace;
        cursor: help;
        user-select: none;
      }

      .setting-tooltip {
        position: absolute;
        top: calc(100% + 4px);
        right: 0;
        z-index: 20;
        display: none;
        width: min(240px, 75vw);
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(5, 11, 18, 0.96);
        color: var(--text);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.32);
        font: 12px/1.35 "IBM Plex Sans", "Segoe UI", sans-serif;
      }

      .setting-help:hover + .setting-tooltip,
      .setting-help:focus-visible + .setting-tooltip,
      .setting-field[data-tooltip-open="true"] .setting-tooltip {
        display: block;
      }

      .setting-range {
        width: 100%;
        accent-color: var(--accent);
        padding: 0;
        border: 0;
        background: transparent;
      }

      input,
      button {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        background: rgba(7, 15, 24, 0.86);
        color: var(--text);
        font: inherit;
      }

      input:focus,
      button:focus {
        outline: 2px solid rgba(124, 212, 255, 0.45);
        outline-offset: 1px;
      }

      button {
        cursor: pointer;
        background: linear-gradient(135deg, rgba(124, 212, 255, 0.22), rgba(255, 155, 114, 0.16));
        font-weight: 700;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .status-grid {
        display: grid;
        gap: 10px;
      }

      .badge {
        display: block;
        border-radius: 999px;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--muted);
        font: 600 12px/1.2 "IBM Plex Mono", monospace;
        letter-spacing: 0.02em;
      }

      .badge[data-tone="ready"],
      .badge[data-tone="done"],
      .badge[data-tone="online"] {
        color: var(--ok);
        background: rgba(140, 233, 154, 0.1);
      }

      .badge[data-tone="started"] {
        color: var(--accent);
        background: rgba(124, 212, 255, 0.1);
      }

      .badge[data-tone="error"] {
        color: var(--error);
        background: rgba(255, 127, 127, 0.1);
      }

      .badge[data-tone="offline"],
      .badge[data-tone="idle"] {
        color: var(--offline);
      }

      .meta-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font: 600 12px/1.4 "IBM Plex Mono", monospace;
      }

      .source-row {
        display: grid;
        gap: 8px;
      }

      #force-log-content {
        display: grid;
        gap: 10px;
        max-height: 34vh;
        overflow: auto;
      }

      .log-entry {
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 14px;
        padding: 10px 12px;
        background: rgba(5, 10, 16, 0.72);
      }

      .log-entry.error {
        border-color: rgba(255, 127, 127, 0.24);
      }

      .log-meta {
        display: flex;
        gap: 10px;
        margin-bottom: 8px;
        color: var(--accent);
        font: 600 11px/1.2 "IBM Plex Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .log-entry pre {
        margin: 0;
        color: var(--muted);
        white-space: pre-wrap;
        word-break: break-word;
        font: 12px/1.45 "IBM Plex Mono", monospace;
      }

      .canvas-shell {
        position: relative;
        overflow: hidden;
        min-height: 100vh;
      }

      .canvas-shell::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(135deg, rgba(124, 212, 255, 0.06), transparent 30%),
          radial-gradient(circle at 70% 30%, rgba(255, 155, 114, 0.14), transparent 20%);
        pointer-events: none;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100vh;
      }

      .canvas-overlay {
        position: absolute;
        top: 22px;
        right: 22px;
        border: 1px solid var(--line);
        background: rgba(5, 11, 18, 0.7);
        border-radius: 16px;
        padding: 12px 14px;
        min-width: 240px;
        backdrop-filter: blur(20px);
      }

      .canvas-overlay h2 {
        margin: 0 0 8px;
        font: 600 12px/1.2 "IBM Plex Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--accent-warm);
      }

      .canvas-overlay p,
      .canvas-overlay span {
        margin: 0;
        color: var(--muted);
        font: 12px/1.5 "IBM Plex Mono", monospace;
      }

      @media (max-width: 960px) {
        main {
          grid-template-columns: 1fr;
        }

        aside {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .canvas-shell,
        canvas {
          min-height: 56vh;
          height: 56vh;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <aside>
        <section class="panel">
          <h2>Источник</h2>
          <form id="control-form">
            <div class="source-row">
              <label for="src-input">Root SRC</label>
              <input id="src-input" value="zavx0z/git" spellcheck="false" autocomplete="off" />
              <button id="materialize-btn" type="submit" disabled>Пересчитать сцену</button>
            </div>

            <div class="settings-cards">
              <section class="settings-card">
                <h3>Геометрия</h3>
                <div class="settings-group">
                  <div class="setting-field" data-setting-key="levelSizeMultiplier">
                    <div class="setting-label-row">
                      <label for="level-size-input" class="setting-label-text"></label>
                      <span class="setting-value" data-setting-value></span>
                      <button class="setting-help" type="button">!</button>
                    </div>
                    <input class="setting-range" id="level-size-input" type="range" step="0.1" min="1.1" max="4" value="2" />
                  </div>
                  <div class="setting-field" data-setting-key="rootInnerDiameterMm">
                    <div class="setting-label-row">
                      <label for="root-inner-diameter-input" class="setting-label-text"></label>
                      <span class="setting-value" data-setting-value></span>
                      <button class="setting-help" type="button">!</button>
                    </div>
                    <input class="setting-range" id="root-inner-diameter-input" type="range" step="10" min="10" max="3900" value="1000" />
                  </div>
                  <div class="setting-field" data-setting-key="rootSphereRadiusMm">
                    <div class="setting-label-row">
                      <label for="root-sphere-radius-input" class="setting-label-text"></label>
                      <span class="setting-value" data-setting-value></span>
                      <button class="setting-help" type="button">!</button>
                    </div>
                    <input class="setting-range" id="root-sphere-radius-input" type="range" step="10" min="10" max="4000" value="200" />
                  </div>
                </div>
              </section>

              <section class="settings-card">
                <h3>Тор</h3>
                <div class="settings-group">
                  <div class="setting-field" data-setting-key="torusCrossRingRotationDeg">
                    <div class="setting-label-row">
                      <label for="torus-cross-ring-rotation-input" class="setting-label-text"></label>
                      <span class="setting-value" data-setting-value></span>
                      <button class="setting-help" type="button">!</button>
                    </div>
                    <input class="setting-range" id="torus-cross-ring-rotation-input" type="range" step="1" min="-180" max="180" value="44" />
                  </div>
                  <div class="setting-field" data-setting-key="torusRadialSegments">
                    <div class="setting-label-row">
                      <label for="torus-radial-segments-input" class="setting-label-text"></label>
                      <span class="setting-value" data-setting-value></span>
                      <button class="setting-help" type="button">!</button>
                    </div>
                    <input class="setting-range" id="torus-radial-segments-input" type="range" step="1" min="3" max="64" value="12" />
                  </div>
                  <div class="setting-field" data-setting-key="torusTubularSegments">
                    <div class="setting-label-row">
                      <label for="torus-tubular-segments-input" class="setting-label-text"></label>
                      <span class="setting-value" data-setting-value></span>
                      <button class="setting-help" type="button">!</button>
                    </div>
                    <input class="setting-range" id="torus-tubular-segments-input" type="range" step="1" min="3" max="96" value="12" />
                  </div>
                </div>
              </section>

              <section class="settings-card">
                <h3>Подписи</h3>
                <div class="settings-group">
                  <div class="setting-field" data-setting-key="labelVisibleLevels">
                    <div class="setting-label-row">
                      <label for="label-visible-levels-input" class="setting-label-text"></label>
                      <span class="setting-value" data-setting-value></span>
                      <button class="setting-help" type="button">!</button>
                    </div>
                    <input class="setting-range" id="label-visible-levels-input" type="range" step="1" min="1" max="8" value="2" />
                  </div>
                  <div class="setting-field" data-setting-key="labelFontSizeMm">
                    <div class="setting-label-row">
                      <label for="label-font-size-input" class="setting-label-text"></label>
                      <span class="setting-value" data-setting-value></span>
                      <button class="setting-help" type="button">!</button>
                    </div>
                    <input class="setting-range" id="label-font-size-input" type="range" step="1" min="1" max="400" value="120" />
                  </div>
                  <div class="setting-field" data-setting-key="labelSurfaceOffsetMm">
                    <div class="setting-label-row">
                      <label for="label-surface-offset-input" class="setting-label-text"></label>
                      <span class="setting-value" data-setting-value></span>
                      <button class="setting-help" type="button">!</button>
                    </div>
                    <input class="setting-range" id="label-surface-offset-input" type="range" step="1" min="0" max="300" value="40" />
                  </div>
                </div>
              </section>

              <section class="settings-card">
                <h3>Детализация</h3>
                <div class="settings-group">
                  <div class="setting-field" data-setting-key="detailDensityFactor">
                    <div class="setting-label-row">
                      <label for="detail-density-input" class="setting-label-text"></label>
                      <span class="setting-value" data-setting-value></span>
                      <button class="setting-help" type="button">!</button>
                    </div>
                    <input class="setting-range" id="detail-density-input" type="range" step="0.05" min="0.05" max="6" value="2" />
                  </div>
                  <div class="setting-field" data-setting-key="detailLevelMultiplier">
                    <div class="setting-label-row">
                      <label for="detail-level-input" class="setting-label-text"></label>
                      <span class="setting-value" data-setting-value></span>
                      <button class="setting-help" type="button">!</button>
                    </div>
                    <input class="setting-range" id="detail-level-input" type="range" step="0.05" min="0.5" max="3" value="1.5" />
                  </div>
                  <div class="setting-field" data-setting-key="wireframeOpacity">
                    <div class="setting-label-row">
                      <label for="wireframe-opacity-input" class="setting-label-text"></label>
                      <span class="setting-value" data-setting-value></span>
                      <button class="setting-help" type="button">!</button>
                    </div>
                    <input class="setting-range" id="wireframe-opacity-input" type="range" step="0.01" min="0" max="1" value="0.9" />
                  </div>
                </div>
              </section>
            </div>
          </form>
        </section>

        <section class="panel">
          <h2>Сцена</h2>
          <div class="meta-row">
             <span id="bulk-counter">0 shells / 0 fields</span>
          </div>
        </section>
      </aside>

      <section class="canvas-shell">
        <canvas id="bulk-canvas"></canvas>
      </section>
    </main>
    <script type="module" src="/client.js"></script>
  </body>
</html>
