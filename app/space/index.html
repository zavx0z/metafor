<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' space:; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' space:; style-src 'self' 'unsafe-inline' space:; img-src 'self' data: blob: space:; font-src 'self' data: space:; connect-src 'self' data: blob: space: ws://127.0.0.1:* http://127.0.0.1:*; frame-src 'self' http://127.0.0.1:* http://localhost:*" />
    <title>metafor / space</title>
    <link rel="stylesheet" href="./style-overlay.css" />
  </head>
  <body>
    <div id="card">
      <header class="space-toolbar">
        <span class="brand">@metafor / space</span>
        <span class="server" id="server-status">interpreter: …</span>
        <span class="sep"></span>
        <button id="pick-project" title="Выбрать директорию проекта">📁 project</button>
        <span class="path muted" id="project-path"></span>
        <button id="pick-file" title="Выбрать файл-точку входа">📄 entry</button>
        <span class="path muted" id="entry-path"></span>
        <span class="sep"></span>
        <label class="toggle"><input type="checkbox" id="pause-on-start" /> pause on start</label>
        <button id="run" class="primary">▶ Run</button>
        <button id="stop">■ Stop</button>
      </header>
      <iframe id="interpreter-frame" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups"></iframe>
      <div id="overlay-msg" hidden></div>
    </div>
    <script type="module" src="./src/toolbar.ts"></script>
  </body>
</html>
