<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#050b12">
  <title>MetaFor</title>
  <link rel="icon" href="/assets/icons/favicon.ico" sizes="16x16 24x24 32x32 48x48 64x64 256x256" type="image/x-icon">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050b12;
    }

    #visual-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "@cosmos/release": "/@cosmos/release?env=main",
        "@internal/visual": "/@internal/visual?env=main"
      }
    }
  </script>
</head>
<body>
  <canvas id="visual-canvas"></canvas>
  <script type="module" src="/@cosmos/startup?env=main"></script>
</body>
</html>
