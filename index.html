  <head>
    <meta charset="UTF-8" />
    <title>MetaFor</title>
    <style>
      html,
      body {
        background-color: black;
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
      }
      canvas {
        width: 100vw;

      }
    </style>

  <script type="importmap">
    {
      "imports": {
        "metafor.js": "./dist/web/metafor.js",
        "console.js": "./dist/web/console.js"
      }
    }
  </script>
  <script type="module">
    import { log } from "console.js"
    new BroadcastChannel("channel").onmessage = (
      /** @type {MessageEvent<import("./web/metafor.js").Message>} */ event
    ) => {
      const { data } = event
      if (Object.hasOwn(data, "meta")) {
        for (const patch of data.patches) log({ meta: data.meta, patch, timestamp: data.timestamp, actor: data.actor })
      } else {
        console.log(data)
      }
    }
  </script>
  <script type="module">
    import { space } from "metafor.js"
    space("/zavx0z/app.js")
  </script>

    <canvas></canvas>
  </body>
