<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MetaFor</title>
    <style>
      html,
      body {
        background-color: black;
      }
    </style>
  </head>
  <script type="importmap">
    {
      "imports": {
        "metafor": "./dist/web/metafor.js"
      }
    }
  </script>
  <script type="module">
    import { log } from "./web/console.js"
    new BroadcastChannel("channel").onmessage = (
      /** @type {MessageEvent<import("./web/metafor.js").Message>} */ event
    ) => {
      const { data } = event
      if (Object.hasOwn(data, "meta")) {
        for (const patch of data.patches) log({ meta: data.meta, patch, timestamp: data.timestamp, actor: data.actor })
      } else {
        console.log(data)
      }
    }
  </script>
  <script type="module" src="./dist/web/metafor.js"></script>
  <body>
    <meta-for class="zavx0z/app" id="1"></meta-for>
  </body>
</html>
