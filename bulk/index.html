<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>MetaFor</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050b12;
      }

      html.metafor-app-fullscreen-fallback,
      html.metafor-app-fullscreen-fallback body {
        width: 100vw;
        width: 100dvw;
        height: 100vh;
        height: 100dvh;
        max-width: 100vw;
        max-width: 100dvw;
        max-height: 100vh;
        max-height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
      }

      html.metafor-app-fullscreen-fallback body {
        position: fixed;
        inset: 0;
      }

      #bulk-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }

      html.metafor-app-fullscreen-fallback #bulk-canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        width: 100dvw;
        height: 100vh;
        height: 100dvh;
      }
    </style>
  </head>
  <body>
    <canvas id="bulk-canvas"></canvas>
    <script type="module" src="./client.ts"></script>
  </body>
</html>
